name: Build and deploy WASM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI (version pinned by xtask)
        run: |
          V=$(grep -oP 'WASM_BINDGEN: &str = "\K[^"]+' xtask/src/main.rs)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$V"; then
            cargo install wasm-bindgen-cli --version "$V" --locked
          fi
          wasm-bindgen --version

      - name: Add ChromeOS memory/GPU defaults to the page
        run: |
          python3 - <<'PY'
          p = "apps/effectcraft-web/web/index.html"
          html = open(p, encoding="utf-8").read()
          js = open("wasm/chromeos-defaults.js", encoding="utf-8").read()
          assert "<head>" in html
          open(p, "w", encoding="utf-8").write(html.replace("<head>", "<head>\n  <script>\n" + js + "  </script>", 1))
          PY

      - name: Build effectcraft-web (release)
        run: cargo xtask web

      - name: Check the wasm table can grow (wasm-bindgen grows it at start-up)
        run: |
          python3 - <<'PY'
          d = open("target/web/dist/effectcraft_web_bg.wasm", "rb").read()
          def leb(i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          i = 8; bad = False
          while i < len(d):
              sid = d[i]; i += 1; sz, i = leb(i); end = i + sz
              if sid == 4:
                  n, j = leb(i)
                  for _ in range(n):
                      j += 1; fl = d[j]; j += 1; mn, j = leb(j); mx = None
                      if fl & 1: mx, j = leb(j)
                      print("table min", mn, "max", mx)
                      if mx is not None and mx < mn + 4: bad = True
              i = end
          raise SystemExit("table has no room to grow" if bad else 0)
          PY

      - name: Add .nojekyll
        run: touch target/web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
