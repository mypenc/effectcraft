[package]
name = "effectcraft-android"
description = "EffectCraft for Android: the same engine and egui UI, native (NativeActivity-free GameActivity app, not a web view)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "effectcraft_android"
crate-type = ["cdylib"]

# Everything is Android-only. On other targets this crate is an empty library, so
# `cargo build --workspace` and `cargo test --workspace` keep working on desktop CI.
[target.'cfg(target_os = "android")'.dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
egui = { workspace = true }
# GameActivity (not NativeActivity): it brings the input-method plumbing the soft keyboard needs.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-game-activity"] }
android-activity = { version = "0.6", features = ["game-activity"] }
jni = "0.21"
serde_json = { workspace = true }
cpal = { workspace = true }
log = { workspace = true }

# This crate needs `unsafe` for JNI and the exported entry points; the rest of the workspace
# forbids it (`[workspace.lints.rust] unsafe_code = "forbid"`), so it opts out of that table.
[lints.rust]
unsafe_code = "allow"
